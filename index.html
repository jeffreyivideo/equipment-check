<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機械設備作業前檢點</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f0f2f5;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            /* ⭐ 核心修改 1：加大往上推移的距離，從 -15px 改為 -45px，把橫幅徹底藏到螢幕外 */
            top: -45px; 
            left: 0;
            width: 100%;
            /* ⭐ 核心修改 2：配合推移距離，將高度補償從 +15px 改為 +45px，避免底部被切掉 */
            height: calc(100% + 45px); 
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- ⭐ 核心修改：加上 allow="geolocation" 讓內嵌的網頁可以請求 GPS 權限 -->
        <iframe id="gasIframe" src="" allow="geolocation"></iframe>
    </div>

    <script>
        // 1. 請將下方引號內的網址，替換成您剛剛「最新部署」的 GAS 網址 (不要包含問號後面的東西)
        const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyWJBGPdHPwJU1mimPoM8D9wNH-fReaUG1aJy5po2C8ZG3GnEGLtoGklFbPB6ieGqhe/exec";
        
        // 2. 抓取目前 GitHub 網址後方的所有參數 (例如: ?equipId=H06-2303-113A-05)
        const queryString = window.location.search;
        
        // 3. 把 GAS 網址跟參數組合起來，塞進 iframe 裡面執行
        document.getElementById("gasIframe").src = gasBaseUrl + queryString;
    </script>
</body>
</html>
