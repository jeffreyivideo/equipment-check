<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機械設備作業前檢點</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f0f2f5;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: -15px; /* 往上推移隱藏橫幅 */
            left: 0;
            width: 100%;
            height: calc(100% + 15px);
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- 先給一個空的 src，稍後用腳本動態填入 -->
        <iframe id="gasIframe" src=""></iframe>
    </div>

    <script>
        // 1. 請將下方引號內的網址，替換成您剛剛「最新部署」的 GAS 網址 (不要包含問號後面的東西)
        const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyWJBGPdHPwJU1mimPoM8D9wNH-fReaUG1aJy5po2C8ZG3GnEGLtoGklFbPB6ieGqhe/exec";
        
        // 2. 抓取目前 GitHub 網址後方的所有參數 (例如: ?equpid=GeneS125)
        const queryString = window.location.search;
        
        // 3. 把 GAS 網址跟參數組合起來，塞進 iframe 裡面執行
        document.getElementById("gasIframe").src = gasBaseUrl + queryString;
    </script>
</body>
</html>
