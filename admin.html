<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信實管理 - 設備檢點後台</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f0f2f5;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- 這裡放入您帶有 ?admin=1 的 GAS 專屬短網址 -->
        <iframe src="https://script.google.com/macros/s/AKfycbyWJBGPdHPwJU1mimPoM8D9wNH-fReaUG1aJy5po2C8ZG3GnEGLtoGklFbPB6ieGqhe/exec?admin=1"></iframe>
    </div>
</body>
</html>
